[project]
name = "unirig"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "addict>=2.4.0",
    "einops>=0.8.1",
    "fast-simplification>=0.1.11",
    "flash-attn==2.8.3",
    "huggingface-hub>=0.33.2",
    "lightning>=2.5.2",
    "numpy==1.26.4",
    "omegaconf>=2.3.0",
    "open3d>=0.19.0",
    "psutil>=7.1.3",
    "pyrender>=0.1.45",
    "python-box>=7.3.2",
    "pytorch-lightning>=2.5.2",
    "spconv-cu120>=2.3.6",
    "timm>=1.0.16",
    "torch==2.8.0",
    "torch-cluster>=1.6.3",
    "torch-scatter>=2.1.2",
    "transformers==4.51.3",
    "trimesh>=4.6.13",
]

[tool.uv]
no-build-isolation-package = ["torch-cluster"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
flash_attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.11/flash_attn-2.8.3+cu128torch2.8-cp311-cp311-linux_x86_64.whl" }
torch_cluster = { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_cluster-1.6.3%2Bpt28cu128-cp311-cp311-linux_x86_64.whl" }
torch_scatter = { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_scatter-2.1.2%2Bpt28cu128-cp311-cp311-linux_x86_64.whl" }
